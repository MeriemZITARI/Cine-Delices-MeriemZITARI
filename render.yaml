services:
  - type: web
    name: backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cine-db
          property: connectionString


  - type: web
    name: frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: front
    envVars:
      - key: VITE_API_URL
        value: https://backend-0yid.onrender.com  # À mettre à jour après déploiement

databases:
  - name: cine-db
    plan: free
