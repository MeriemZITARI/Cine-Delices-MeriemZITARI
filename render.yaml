services:
  - type: web
    name: backend
    env: docker
    plan: Free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cine-db
          property: connectionString
      - key: JWT_SECRET
        value: un_super_secret
      - key: TMDB_API_KEY
        value: 1923f2b998e0a232766db7ede4e6c1b9

  - type: web
    name: frontend
    env: static
    plan: Free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: front
    envVars:
      - key: VITE_API_BASE_URL
        value: https://backend-XXXX.onrender.com/api  # À mettre à jour après déploiement
      - key: VITE_TMDB_API_KEY
        value: 1923f2b998e0a232766db7ede4e6c1b9
      - key: VITE_OMDB_API_KEY
        value: 24f1bf71

databases:
  - name: cine-db
    plan: Free
